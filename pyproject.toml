[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "soc-log-analyzer"
version = "1.0.0"
description = "A defensive SOC tool for detecting suspicious authentication activity."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Khaya Guzu"}]

[project.scripts]
soc-log-analyzer = "soc_log_analyzer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
